services:
  - type: web
    name: fincal
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Add secrets in Render dashboard (do NOT commit):
      # - DATABASE_URL
      # - JWT_SECRET
      # - SESSION_SECRET
      # - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (if using Google sign-in)
      #   Optional: GOOGLE_CALLBACK_URL — omit it on Render; the app uses /api/auth/google/callback relative to the request host.
      #   Do NOT set GOOGLE_CALLBACK_URL to localhost on Render. In Google Cloud, add each redirect URI you use, e.g.
      #   https://YOUR-SERVICE.onrender.com/api/auth/google/callback (and custom domain if applicable).
      # - PLAID_CLIENT_ID / PLAID_SECRET / PLAID_ENV (optional)

